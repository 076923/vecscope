[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vecscope"
dynamic = ["version"]
description = "Embedding space evidence for agents: hubness, anisotropy, collapse, ANN recall."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Daehee Yun" }]
keywords = ["embeddings", "vector-search", "rag", "agents", "mcp", "hubness", "anisotropy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/076923/vecscope"
Repository = "https://github.com/076923/vecscope"
Issues = "https://github.com/076923/vecscope/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
index = ["faiss-cpu>=1.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vecscope = "vecscope.cli:main"
vecscope-mcp = "vecscope.mcp_server:main"

[tool.hatch.version]
path = "src/vecscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vecscope"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
