[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vecscope"
dynamic = ["version"]
description = "Deterministic evidence about embedding spaces and vector indexes for agents: hubness, anisotropy, collapse, distance concentration, ANN recall, HNSW/IVF sweeps. CLI and MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Daehee Yun" }]
keywords = ["embeddings", "vector-search", "rag", "agents", "mcp", "hubness", "anisotropy", "faiss", "hnsw", "semantic-search", "embedding-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/076923/vecscope"
Repository = "https://github.com/076923/vecscope"
Issues = "https://github.com/076923/vecscope/issues"
Changelog = "https://github.com/076923/vecscope/blob/main/CHANGELOG.md"
Documentation = "https://076923.github.io/vecscope/"

[project.optional-dependencies]
index = ["faiss-cpu>=1.8"]
# Meta's CUDA 12.6+ wheels exist for Linux x86_64 only; never install next to "index" (both ship faiss)
index-gpu = ["faiss-gpu>=1.14.3; sys_platform == 'linux' and platform_machine == 'x86_64'"]
qdrant = ["qdrant-client>=1.10"]
chroma = ["chromadb>=0.5"]
milvus = ["pymilvus[milvus_lite]>=2.4"]
weaviate = ["weaviate-client>=4.4"]
stores = ["vecscope[index,qdrant,chroma,milvus,weaviate]"]
dev = ["pytest>=8", "ruff>=0.5", "scipy>=1.10", "pyarrow>=14"]

[dependency-groups]
# the documentation site: zensical build --strict (see zensical.toml)
docs = ["zensical>=0.1.0"]

[project.scripts]
vecscope = "vecscope.cli:main"
vecscope-mcp = "vecscope.mcp_server:main"

[tool.hatch.version]
path = "src/vecscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vecscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: large-n exactness checks (minutes); run with -m slow",
  "gpu: needs a faiss GPU build and a visible GPU",
]
