[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vecscope"
dynamic = ["version"]
description = "Deterministic evidence about embedding spaces and vector indexes for agents: hubness, anisotropy, collapse, distance concentration, ANN recall, HNSW/IVF sweeps. CLI and MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Daehee Yun" }]
keywords = ["embeddings", "vector-search", "rag", "agents", "mcp", "hubness", "anisotropy", "faiss", "hnsw", "semantic-search", "embedding-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/076923/vecscope"
Repository = "https://github.com/076923/vecscope"
Issues = "https://github.com/076923/vecscope/issues"
Changelog = "https://github.com/076923/vecscope/blob/main/CHANGELOG.md"
Documentation = "https://github.com/076923/vecscope#readme"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
index = ["faiss-cpu>=1.8"]
dev = ["pytest>=8", "ruff>=0.5", "scipy>=1.10", "pyarrow>=14"]

[project.scripts]
vecscope = "vecscope.cli:main"
vecscope-mcp = "vecscope.mcp_server:main"

[tool.hatch.version]
path = "src/vecscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vecscope"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: large-n exactness checks (minutes); run with -m slow",
  "gpu: needs a faiss GPU build and a visible GPU",
]
