name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,index]"
      - run: ruff check src tests examples action
      - run: ruff format --check src tests examples action
      - run: pytest -q
      - name: CLI smoke test
        run: |
          python examples/make_examples.py
          vecscope audit examples/healthy.npy
          vecscope --version

  stores:
    # the vector store adapters against local Qdrant, Chroma and Milvus Lite (Linux only:
    # Milvus Lite has no Windows build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,stores]"
      - run: pytest -q tests/test_adapters.py tests/test_agent_workflow.py -rs

  action:
    # the composite action in action.yml, as a workflow would call it
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Write the example matrices (make_examples() needs only NumPy)
        run: |
          python -m pip install numpy
          cd examples
          python -c "import numpy as np; from make_examples import make_examples; [np.save(f'{k}.npy', v) for k, v in make_examples().items()]"
          # labeled queries next to known rows, and the same rows in another order (a lost id
          # mapping: no finding changes, labeled retrieval collapses)
          python -c "import json, numpy as np; x = np.load('healthy.npy'); r = np.random.default_rng(0); t = r.choice(len(x), 50, replace=False); np.save('queries.npy', x[t] + 0.05 * r.standard_normal((50, x.shape[1])).astype(x.dtype)); json.dump({str(i): {str(int(d)): 1} for i, d in enumerate(t)}, open('qrels.json', 'w')); np.save('moved.npy', x[r.permutation(len(x))])"
        shell: bash
      - name: Healthy matrix passes and writes the baseline
        id: healthy
        uses: ./ # zizmor: ignore[self-repository] the action under test is this checkout
        with:
          path: examples/healthy.npy
          sample: "0"
          output: out/baseline.json
      - name: Collapsed matrix fails against the baseline
        id: collapsed
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] the action under test is this checkout
        with:
          path: examples/collapsed.npy
          baseline: out/baseline.json
          sample: "0"
          output: out/collapsed.json
      - name: Labeled baseline
        id: labeled
        uses: ./ # zizmor: ignore[self-repository] the action under test is this checkout
        with:
          path: examples/healthy.npy
          queries: examples/queries.npy
          qrels: examples/qrels.json
          sample: "0"
          output: out/labeled.json
      - name: Lost id mapping fails on retrieval only
        id: moved
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository] the action under test is this checkout
        with:
          path: examples/moved.npy
          queries: examples/queries.npy
          qrels: examples/qrels.json
          baseline: out/labeled.json
          retrieval-tolerance: ndcg_at_k=0.01, recall_at_k=0.02
          sample: "0"
          output: out/moved.json
      - name: Check the outputs
        shell: bash
        env:
          H_VERDICT: ${{ steps.healthy.outputs.verdict }}
          H_CODE: ${{ steps.healthy.outputs.exit-code }}
          C_OUTCOME: ${{ steps.collapsed.outcome }}
          C_CODE: ${{ steps.collapsed.outputs.exit-code }}
          C_REGRESSIONS: ${{ steps.collapsed.outputs.regressions }}
          L_CODE: ${{ steps.labeled.outputs.exit-code }}
          M_CODE: ${{ steps.moved.outputs.exit-code }}
          M_REGRESSIONS: ${{ steps.moved.outputs.regressions }}
          M_RETRIEVAL: ${{ steps.moved.outputs.retrieval-regressions }}
        run: |
          set -x
          test "$H_VERDICT" = ok
          test "$H_CODE" = 0
          test "$C_OUTCOME" = failure
          test "$C_CODE" = 1
          [[ ",$C_REGRESSIONS," == *,collapse,* ]]
          test "$L_CODE" = 0
          test "$M_CODE" = 1
          test -z "$M_REGRESSIONS"
          test "$M_RETRIEVAL" = "exact.ndcg_at_k,exact.recall_at_k"

  build:
    # the wheel and sdist that release.yml would publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

  zizmor:
    # static analysis of the workflows themselves
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install zizmor
      - run: zizmor --format=github .github/workflows action.yml
        env:
          GH_TOKEN: ${{ github.token }}
