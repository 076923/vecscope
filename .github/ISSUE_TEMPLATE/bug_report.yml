name: Bug report
description: A finding, verdict, loader or CLI behaviour that looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the command (or MCP call) and the output. `--json` output is best.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: shape
    attributes:
      label: Input shape and format
      placeholder: "n=120000, dim=768, .parquet, float32"
  - type: input
    id: version
    attributes:
      label: vecscope and Python version
      placeholder: "vecscope 0.1.0, Python 3.12, Windows 11"
