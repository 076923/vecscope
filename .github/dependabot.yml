version: 2
updates:
  # Keeps the SHA-pinned actions (and their version comments) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
  # Only bump a lower bound when the newest release falls outside it, so the
  # tested minimum versions stay as they are.
  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
