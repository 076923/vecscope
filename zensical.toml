# Documentation site, built with Zensical (https://zensical.org).
# Build: zensical build --strict    Preview: zensical serve

[project]
site_name = "vecscope"
site_description = "Deterministic evidence about embedding spaces and vector indexes for agents: hubness, anisotropy, collapse, distance concentration, ANN recall, HNSW/IVF sweeps. CLI and MCP server."
site_author = "Daehee Yun"
site_url = "https://076923.github.io/vecscope/"
repo_url = "https://github.com/076923/vecscope"
repo_name = "076923/vecscope"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Daehee Yun"
extra_css = ["assets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Retrieval quality" = "retrieval_quality.md" },
  { "Verification" = "verification.md" },
  { "Agent cases" = "agent_case.md" },
  { "Changelog" = "changelog.md" },
  { "한국어" = [
    { "소개" = "ko/README.md" },
    { "검색 품질" = "ko/retrieval_quality.md" },
    { "검증 결과" = "ko/verification.md" },
    { "에이전트 사례" = "ko/agent_case.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/076923/vecscope"
name = "Source on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/vecscope/"
name = "vecscope on PyPI"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
# Keeps Korean headings as anchors (the default slugify drops non-ASCII characters)
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.snippets.check_paths = true
